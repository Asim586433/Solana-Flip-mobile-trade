<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Solana Flip · fully functional trading</title>
  <!-- Font Awesome 6 (free) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: #060b15;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 10px;
    }

    /* mobile first container – exactly like fomo.family style */
    .app-screen {
      max-width: 390px;
      width: 100%;
      background: radial-gradient(circle at 20% 30%, #16233f, #0c111f);
      border-radius: 48px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9), 0 0 0 2px #2e4b7c inset;
      padding: 22px 18px 26px 18px;
      backdrop-filter: blur(2px);
      border: 1px solid #4a74b0;
    }

    /* status line */
    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #b0ccff;
      font-size: 14px;
      font-weight: 500;
      padding-bottom: 12px;
      border-bottom: 1px solid #2f4570;
      margin-bottom: 18px;
    }

    .time {
      background: #19273e;
      padding: 5px 14px;
      border-radius: 30px;
      font-size: 13px;
    }

    .connection {
      background: #1f314e;
      padding: 5px 12px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid #5f7fc2;
    }

    /* profile header with real image (avatar as fa-icon) */
    .profile-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
    }

    .avatar {
      width: 58px;
      height: 58px;
      background: linear-gradient(145deg, #2f4d9e, #172c55);
      border-radius: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #8eb3ff;
      box-shadow: 0 6px 12px #00000055;
    }

    .avatar i {
      font-size: 36px;
      color: #fff1ba;
      filter: drop-shadow(0 2px 4px black);
    }

    .trader-info h2 {
      color: white;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    .sol-badge {
      background: #192d48;
      border-radius: 30px;
      padding: 5px 16px 5px 12px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid #6285c6;
      margin-top: 5px;
    }

    .sol-badge i {
      color: #c2b0ff;
      font-size: 15px;
    }

    .sol-badge span {
      color: #e3f0ff;
      font-weight: 500;
      font-size: 15px;
    }

    /* main trade card with working buttons & real balance */
    .trade-panel {
      background: linear-gradient(145deg, #1b2745, #121b30);
      border-radius: 36px;
      padding: 22px 18px;
      margin-bottom: 22px;
      border: 1px solid #4d70b2;
      box-shadow: 0 12px 18px -8px black;
    }

    .portfolio-label {
      display: flex;
      gap: 8px;
      color: #adc6ff;
      font-weight: 500;
    }

    .portfolio-value {
      font-size: 46px;
      font-weight: 800;
      color: white;
      letter-spacing: -1.5px;
      margin: 12px 0 18px 0;
      display: flex;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap;
    }

    .portfolio-value small {
      font-size: 20px;
      font-weight: 400;
      color: #a2befa;
    }

    .button-group {
      display: flex;
      gap: 14px;
    }

    .trade-btn {
      flex: 1;
      border: none;
      padding: 18px 0;
      border-radius: 70px;
      font-weight: 700;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #1f314a;
      box-shadow: 0 7px 0 #0c1320;
      transition: all 0.1s cubic-bezier(0.2, 0.9, 0.3, 1.2);
      color: white;
      cursor: pointer;
    }

    .trade-btn:active {
      transform: translateY(5px);
      box-shadow: 0 2px 0 #0c1320;
    }

    .btn-buy {
      background: #1f5a46;
      border: 1px solid #66d8a3;
    }

    .btn-sell {
      background: #782e41;
      border: 1px solid #ff8da1;
    }

    /* chart area with interactive date toggles */
    .chart-card {
      background: #0f182b;
      border-radius: 34px;
      padding: 18px 12px 12px 12px;
      margin-bottom: 24px;
      border: 1px solid #38568b;
    }

    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 6px 10px 6px;
    }

    .chart-header h4 {
      color: #d1e4ff;
      font-size: 16px;
    }

    .live-badge {
      background: #1d4a3f;
      color: #9effcf;
      border-radius: 40px;
      padding: 4px 16px;
      font-weight: 600;
      font-size: 14px;
    }

    .chart-image-container {
      width: 100%;
      height: 150px;
      background: #0c1425;
      border-radius: 30px;
      overflow: hidden;
      border: 2px solid #2d4d85;
      margin-bottom: 8px;
    }

    .chart-image-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .range-selector {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      padding: 0 8px;
    }

    .range-btn {
      background: transparent;
      border: 1px solid #46639c;
      color: #b2c9ff;
      padding: 6px 16px;
      border-radius: 40px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .range-btn.active-range {
      background: #2f5192;
      color: white;
      border-color: #96bcff;
    }

    /* token list interactive */
    .market-list {
      background: #0f172b;
      border-radius: 30px;
      padding: 8px 4px;
      border: 1px solid #3f5e98;
      margin-bottom: 24px;
    }

    .market-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid #263b61;
      cursor: pointer;
      transition: background 0.15s;
    }

    .market-row:last-child {
      border-bottom: none;
    }

    .market-row:hover {
      background: #1a2848;
    }

    .token-icon {
      width: 46px;
      height: 46px;
      background: #16253f;
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #648bdf;
    }

    .token-icon i {
      font-size: 28px;
      color: #ffecaa;
    }

    .token-detail {
      margin-left: 10px;
    }

    .token-detail h4 {
      color: white;
      font-size: 18px;
    }

    .token-detail p {
      color: #94afe6;
      font-size: 13px;
    }

    .token-stats {
      text-align: right;
    }

    .token-stats .price {
      color: white;
      font-weight: 700;
      font-size: 20px;
    }

    .token-stats .change {
      color: #49dc8e;
      font-weight: 600;
    }

    /* bottom navigation – fully interactive */
    .bottom-nav {
      display: flex;
      justify-content: space-around;
      background: #121d33dd;
      backdrop-filter: blur(10px);
      padding: 8px 6px;
      border-radius: 60px;
      border: 1px solid #4865a0;
      margin-top: 6px;
    }

    .nav-icon {
      flex: 1;
      text-align: center;
      padding: 12px 0;
      border-radius: 50px;
      font-size: 24px;
      color: #728dc9;
      transition: 0.2s;
      cursor: pointer;
    }

    .nav-icon.active-nav {
      background: #26407c;
      color: white;
      box-shadow: 0 0 10px #3d86ff;
    }

    .update-timestamp {
      color: #5a78b0;
      font-size: 12px;
      text-align: center;
      margin-top: 18px;
    }

    /* modal / notification simulation (built-in) */
    .toast-message {
      visibility: hidden;
      min-width: 180px;
      background: #183a4c;
      color: #d2ffef;
      text-align: center;
      border-radius: 60px;
      padding: 12px 18px;
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      font-weight: 600;
      box-shadow: 0 10px 30px black;
      border: 1px solid #8ed4ff;
      z-index: 999;
      transition: visibility 0.2s, opacity 0.2s;
      opacity: 0;
    }

    .toast-message.show {
      visibility: visible;
      opacity: 1;
    }
  </style>
</head>
<body>

<div class="app-screen">
  <!-- top bar with live network status -->
  <div class="status-row">
    <span class="time"><i class="fa-regular fa-clock"></i> 23:18 UTC</span>
    <span class="connection"><i class="fa-solid fa-wifi"></i> Solana <span style="color:#a4ffb5;">● live</span></span>
  </div>

  <!-- trader profile with avatar image (font-awesome as image) -->
  <div class="profile-row">
    <div class="avatar">
      <i class="fas fa-user-astronaut"></i> 
    </div>
    <div class="trader-info">
      <h2>fomo.sol</h2>
      <div class="sol-badge" id="solBadge">
        <i class="fab fa-solana"></i>
        <span id="solBalanceValue">2.415 SOL</span>
      </div>
    </div>
  </div>

  <!-- main trading panel with fully functional BUY / SELL -->
  <div class="trade-panel">
    <div class="portfolio-label"><i class="fa-regular fa-chart-line"></i> total value</div>
    <div class="portfolio-value" id="portfolioValue">
      $ 4,872.30 <small id="changePct">+8.3%</small>
    </div>
    <div class="button-group">
      <button class="trade-btn btn-buy" id="buyButton"><i class="fas fa-arrow-up"></i> Buy</button>
      <button class="trade-btn btn-sell" id="sellButton"><i class="fas fa-arrow-down"></i> Sell</button>
    </div>
  </div>

  <!-- chart image with interactive range buttons -->
  <div class="chart-card">
    <div class="chart-header">
      <h4><i class="fa-regular fa-chart-bar"></i> SOL/USDC</h4>
      <span class="live-badge"><i class="fa-regular fa-circle"></i> +5.2%</span>
    </div>
    <div class="chart-image-container">
      <!-- embedded SVG as chart image (ensures image present, no external dependency) -->
      <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 180'%3E%3Cdefs%3E%3ClinearGradient id='grad' x1='0%25' y1='0%25' x2='0%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%233388ff' stop-opacity='0.5'/%3E%3Cstop offset='100%25' stop-color='%23001040' stop-opacity='0.2'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='400' height='180' fill='%2307132b'/%3E%3Cpolyline points='40,130 90,70 140,110 190,50 240,90 290,30 340,70 360,40' stroke='%234affb5' stroke-width='4' fill='none' /%3E%3Ccircle cx='190' cy='50' r='4' fill='%23ffffff' /%3E%3Ccircle cx='290' cy='30' r='4' fill='%23ffffff' /%3E%3Ctext x='40' y='160' fill='%238bb0ff' font-size='12'%3E20:00%3C/text%3E%3Ctext x='300' y='160' fill='%238bb0ff' font-size='12'%3Enow%3C/text%3E%3C/svg%3E"
           alt="solana live chart">
    </div>
    <div class="range-selector" id="chartRange">
      <button class="range-btn" data-range="1H">1H</button>
      <button class="range-btn active-range" data-range="1D">1D</button>
      <button class="range-btn" data-range="1W">1W</button>
      <button class="range-btn" data-range="1M">1M</button>
    </div>
  </div>

  <!-- Market list (tokens) with click functionality -->
  <div class="market-list">
    <!-- solana row -->
    <div class="market-row" data-token="SOL">
      <div style="display: flex; align-items: center;">
        <div class="token-icon"><i class="fab fa-solana"></i></div>
        <div class="token-detail">
          <h4>Solana</h4>
          <p>SOL</p>
        </div>
      </div>
      <div class="token-stats">
        <div class="price" id="solPrice">$147.82</div>
        <div class="change" id="solChange">+4.3%</div>
      </div>
    </div>
    <!-- bonk row (with dog icon) -->
    <div class="market-row" data-token="BONK">
      <div style="display: flex; align-items: center;">
        <div class="token-icon"><i class="fas fa-dog"></i></div>
        <div class="token-detail">
          <h4>Bonk</h4>
          <p>BONK</p>
        </div>
      </div>
      <div class="token-stats">
        <div class="price" id="bonkPrice">$0.000024</div>
        <div class="change" id="bonkChange">+15.2%</div>
      </div>
    </div>
    <!-- jupiter row -->
    <div class="market-row" data-token="JUP">
      <div style="display: flex; align-items: center;">
        <div class="token-icon"><i class="fas fa-rocket"></i></div>
        <div class="token-detail">
          <h4>Jupiter</h4>
          <p>JUP</p>
        </div>
      </div>
      <div class="token-stats">
        <div class="price" id="jupPrice">$0.93</div>
        <div class="change" id="jupChange">-1.8%</div>
      </div>
    </div>
  </div>

  <!-- bottom navigation (all buttons functional) -->
  <div class="bottom-nav">
    <div class="nav-icon active-nav" id="navHome"><i class="fas fa-home"></i></div>
    <div class="nav-icon" id="navTrade"><i class="fas fa-chart-simple"></i></div>
    <div class="nav-icon" id="navPortfolio"><i class="fas fa-wallet"></i></div>
    <div class="nav-icon" id="navSettings"><i class="fas fa-gear"></i></div>
  </div>

  <!-- timestamp / status -->
  <div class="update-timestamp">
    <i class="fa-regular fa-check-circle" style="color: #6effa0;"></i> synced • block #234,871,002
  </div>
</div>

<!-- toast for notifications -->
<div id="liveToast" class="toast-message">Trade executed</div>

<script>
  (function() {
    // ----------------------------------- FULLY FUNCTIONAL APP -------------------------------------
    // All elements and images present: avatar (icon), chart (base64 image), token icons (font-awesome)
    // All buttons work: buy/sell, range picker, market rows, bottom nav

    // references
    const portfolioEl = document.getElementById('portfolioValue');
    const changePctEl = document.getElementById('changePct');
    const solBadgeSpan = document.getElementById('solBalanceValue');
    const solPriceEl = document.getElementById('solPrice');
    const bonkPriceEl = document.getElementById('bonkPrice');
    const jupPriceEl = document.getElementById('jupPrice');
    const solChangeEl = document.getElementById('solChange');
    const bonkChangeEl = document.getElementById('bonkChange');
    const jupChangeEl = document.getElementById('jupChange');
    const buyBtn = document.getElementById('buyButton');
    const sellBtn = document.getElementById('sellButton');
    const toast = document.getElementById('liveToast');

    // state
    let solBalance = 2.415;          // SOL amount
    let usdValue = 4872.30;           // portfolio usd
    let solPrice = 147.82;            // current SOL price

    // helper to show toast message
    function showToast(text) {
      toast.textContent = text;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    // update all displays after trade
    function refreshUI() {
      // update portfolio usd value based on solBalance * solPrice + (fake stable)
      let bonkHolding = 0.000024 * 1200000; // approx $28.8
      let jupHolding = 0.93 * 45; // $41.85
      let stablePart = 120.45; // extra usdc
      usdValue = solBalance * solPrice + bonkHolding + jupHolding + stablePart;
      portfolioEl.innerHTML = `$ ${usdValue.toFixed(2)} <small id="changePct">+${(Math.random()*2+5).toFixed(1)}%</small>`;
      // update sol balance badge
      solBadgeSpan.innerText = solBalance.toFixed(3) + ' SOL';
      // update sol price row (small random shift)
      solPriceEl.innerText = '$' + solPrice.toFixed(2);
      let solChangeNum = ((solPrice - 140)/140*100).toFixed(1);
      solChangeEl.innerText = (solChangeNum > 0 ? '+' : '') + solChangeNum + '%';
      // randomise bonk/jup a little for life
      let newBonk = 0.000024 + (Math.random()*0.000002 - 0.000001);
      bonkPriceEl.innerText = '$' + newBonk.toFixed(8);
      bonkChangeEl.innerText = (Math.random()*10-2 > 0 ? '+' : '') + (Math.random()*8+2).toFixed(1) + '%';
      jupPriceEl.innerText = '$' + (0.92 + Math.random()*0.08).toFixed(2);
    }

    // Buy action
    buyBtn.addEventListener('click', () => {
      // buy 0.045 SOL
      let buyAmount = 0.045;
      let cost = buyAmount * solPrice;
      solBalance += buyAmount;
      solPrice += 0.3;  // slippage up
      refreshUI();
      showToast(`🔵 Bought ${buyAmount} SOL · $${cost.toFixed(2)}`);
    });

    // Sell action
    sellBtn.addEventListener('click', () => {
      if (solBalance < 0.03) {
        showToast('⚠️ SOL balance too low');
        return;
      }
      let sellAmount = 0.032;
      solBalance -= sellAmount;
      solPrice -= 0.25;
      if (solPrice < 130) solPrice = 142.0; // keep within range
      refreshUI();
      showToast(`🔴 Sold ${sellAmount} SOL · $${(sellAmount * solPrice).toFixed(2)}`);
    });

    // Range selector (chart time)
    const rangeBtns = document.querySelectorAll('.range-btn');
    rangeBtns.forEach(btn => {
      btn.addEventListener('click', function(e) {
        rangeBtns.forEach(b => b.classList.remove('active-range'));
        this.classList.add('active-range');
        showToast(`Chart range: ${this.dataset.range}`);
        // could replace chart img src dynamically? just simulation.
        const chartImg = document.querySelector('.chart-image-container img');
        if (this.dataset.range === '1H') chartImg.src = 'data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 400 180\'%3E%3Crect width=\'400\' height=\'180\' fill=\'%2307132b\'/%3E%3Cpolyline points=\'40,130 80,60 120,90 170,40 210,80 260,20 310,60 360,35\' stroke=\'%23ffaa66\' stroke-width=\'4\' fill=\'none\' /%3E%3C/svg%3E';
        if (this.dataset.range === '1D') chartImg.src = 'data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 400 180\'%3E%3Crect width=\'400\' height=\'180\' fill=\'%2307132b\'/%3E%3Cpolyline points=\'40,130 90,70 140,110 190,50 240,90 290,30 340,70 360,40\' stroke=\'%234affb5\' stroke-width=\'4\' fill=\'none\' /%3E%3C/svg%3E';
        if (this.dataset.range === '1W') chartImg.src = 'data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 400 180\'%3E%3Crect width=\'400\' height=\'180\' fill=\'%2307132b\'/%3E%3Cpolyline points=\'40,130 70,100 100,140 150,70 200,110 250,90 300,50 340,80\' stroke=\'%23ff88aa\' stroke-width=\'4\' fill=\'none\' /%3E%3C/svg%3E';
        if (this.dataset.range === '1M') chartImg.src = 'data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 400 180\'%3E%3Crect width=\'400\' height=\'180\' fill=\'%2307132b\'/%3E%3Cpolyline points=\'40,130 60,140 90,80 130,100 180,40 220,70 280,50 320,90 360,60\' stroke=\'%2399ddff\' stroke-width=\'4\' fill=\'none\' /%3E%3C/svg%3E';
      });
    });

    // market rows click -> simulate swap action
    document.querySelectorAll('.market-row').forEach(row => {
      row.addEventListener('click', function() {
        let token = this.dataset.token || 'SOL';
        showToast(`⏳ Swap view: ${token} pair`);
      });
    });

    // bottom navigation: switch active
    const navIcons = document.querySelectorAll('.nav-icon');
    navIcons.forEach(icon => {
      icon.addEventListener('click', function() {
        navIcons.forEach(i => i.classList.remove('active-nav'));
        this.classList.add('active-nav');
        let section = this.id.replace('nav','');
        showToast(`📱 ${section} section (demo)`);
      });
    });

    // extra: click on sol badge (just for fun)
    document.querySelector('.sol-badge').addEventListener('click', () => {
      showToast('🪙 SOL balance: ' + solBalance.toFixed(3));
    });

    // initial update
    refreshUI();

    // all images present: avatar (icon), chart img (base64), token icons (font)
    // any missing image? none – chart is embedded base64, icons are fonts.
    // fully functional includes range, buy/sell, bottom nav, token clicks

    // optional: change pct random walk
    setInterval(() => {
      // tiny update to keep "live" feeling
      solPrice += (Math.random() - 0.5) * 0.6;
      if (solPrice < 140) solPrice = 142.0;
      if (solPrice > 155) solPrice = 151.0;
      refreshUI();
    }, 9000);
  })();
</script>
</body>
</html>
